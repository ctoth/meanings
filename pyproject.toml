[project]
name = "meanings"
version = "0.1.0"
description = "Lexical graph and dictionary kernel tooling."
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "pandas>=3.0.3",
  "scikit-learn>=1.8.0",
  "statsmodels>=0.14.6",
  "wn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
