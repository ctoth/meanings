[project]
name = "meanings"
version = "0.1.0"
description = "Lexical graph and dictionary kernel tooling."
requires-python = ">=3.12"
dependencies = [
  "formal-argumentation",
  "gunray",
  "openpyxl>=3.1.5",
  "pandas>=3.0.3",
  "scikit-learn>=1.8.0",
  "statsmodels>=0.14.6",
  "wn>=0.13.0",
  "z3-solver>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
formal-argumentation = { git = "https://github.com/ctoth/argumentation", rev = "9a9f4c553c7fde3ff30ef15e062c6d4ef8e672ac" }
gunray = { git = "https://github.com/ctoth/gunray", rev = "df4580e1f4c3671159e057ade6d1411512196808" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
